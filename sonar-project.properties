sonar.projectKey=good-action-api
sonar.projectName=Good Action - Sistema de Gestion de Donaciones y Comprobantes
sonar.projectVersion=1.0

# Codigo a analizar
sonar.sources=src,public
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

# Reporte de cobertura generado por Jest (npm test lo crea en coverage/lcov.info)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Carpetas que no se deben analizar
sonar.exclusions=node_modules/**,coverage/**,data/**,public/**/*.min.js

sonar.sourceEncoding=UTF-8
