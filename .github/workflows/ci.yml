name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias con cobertura
        run: npm test

  despliegue-prueba:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Levantar el servidor en el entorno de prueba
        run: npm start &
        env:
          PORT: 3000
          JWT_SECRET: ci-secret

      - name: Verificar que el entorno de prueba responde
        run: |
          sleep 2
          curl --fail http://localhost:3000/api/health
