<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good Action — Gestion de Donaciones</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Good Action</h1>
    <p>Sistema de gestion de donaciones y comprobantes — demo minima</p>
    <span id="sesion-info">No has iniciado sesion</span>
  </header>

  <main>
    <section class="card" id="seccion-auth">
      <h2>Registro / Login</h2>
      <form id="form-registro">
        <h3>Crear cuenta</h3>
        <input type="text" id="reg-nombre" placeholder="Nombre" required>
        <input type="email" id="reg-email" placeholder="Correo" required>
        <input type="password" id="reg-password" placeholder="Contrasena" required>
        <select id="reg-rol">
          <option value="usuario">Usuario (donante)</option>
          <option value="administrador">Administrador</option>
        </select>
        <button type="submit">Registrarme</button>
      </form>

      <form id="form-login">
        <h3>Iniciar sesion</h3>
        <input type="email" id="login-email" placeholder="Correo" required>
        <input type="password" id="login-password" placeholder="Contrasena" required>
        <button type="submit">Entrar</button>
      </form>
      <p id="auth-mensaje"></p>
    </section>

    <section class="card" id="seccion-donacion" hidden>
      <h2>Registrar un donativo</h2>
      <form id="form-donacion">
        <select id="don-tipo">
          <option value="dinero">Dinero</option>
          <option value="alimento">Alimento</option>
          <option value="insumo">Insumo</option>
        </select>
        <input type="number" id="don-cantidad" placeholder="Cantidad" required min="1">
        <input type="text" id="don-descripcion" placeholder="Descripcion (opcional)">
        <button type="submit">Registrar donativo</button>
      </form>
      <p id="don-mensaje"></p>

      <h3>Mis donativos</h3>
      <ul id="lista-donaciones"></ul>

      <div id="panel-admin" hidden>
        <h3>Panel de administracion</h3>
        <button id="btn-impacto">Ver reporte de impacto</button>
        <pre id="reporte-impacto"></pre>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
